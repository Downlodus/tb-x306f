name: Build NetHunter Kernel

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for Kali NetHunter
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git \
        gnupg libncurses5 libncurses5-dev libssl-dev libelf-dev \
        libxml2 libxml2-utils lzop rsync zip zlib1g-dev \
        python3 libarchive-tools wget patch \
        clang lld llvm \
        gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Download Android GCC Toolchain
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

    - name: Apply NetHunter Patches
      run: |
        git clone https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git /tmp/nh-builder || true
        cd kernel-4.19

        if [ -f "/tmp/nh-builder/patches/mac80211/mac80211-1.0-4.14.patch" ]; then
          patch -p1 --forward < /tmp/nh-builder/patches/mac80211/mac80211-1.0-4.14.patch || echo "Patch mac80211 already applied or conflict"
        fi

        if [ -f "/tmp/nh-builder/patches/hid/hid-4.14.patch" ]; then
          patch -p1 --forward < /tmp/nh-builder/patches/hid/hid-4.14.patch || echo "Patch hid already applied or conflict"
        fi
        cd ..

    - name: Patch kernel Makefile
      run: |
        cd kernel-4.19

        # Fix clang cross compiler detection (elfedit might not exist in old toolchains)
        sed -i 's/$(CROSS_COMPILE)elfedit/$(CROSS_COMPILE)as/g' Makefile
        sed -i 's/--prefix=$(GCC_TOOLCHAIN_DIR)/--prefix=$(CROSS_COMPILE)/g' Makefile

        # Прибираємо -Werror
        sed -i 's/$(call cc-option,-Werror=unknown-warning-option,)//g' Makefile
        sed -i 's/KBUILD_CFLAGS += -Werror\b/KBUILD_CFLAGS +=/' Makefile

        # Додаємо Wno для cgrp та інших
        echo 'KBUILD_CFLAGS += -Wno-gnu-variable-sized-type-not-at-end' >> Makefile
        echo 'KBUILD_CFLAGS += -Wno-unused-but-set-variable' >> Makefile
        echo 'KBUILD_CFLAGS += -Wno-align-mismatch' >> Makefile
        echo 'KBUILD_CFLAGS += -Wno-bitwise-instead-of-logical' >> Makefile
        echo 'KBUILD_CFLAGS += -Wno-strict-prototypes' >> Makefile
        echo 'KBUILD_CFLAGS += -Wno-error' >> Makefile

        # Глобально вирізаємо -Werror з усіх Makefile'ів MediaTek, бо старий код повний ворнінгів
        find drivers net fs mm -name "Makefile" -type f -exec sed -i 's/-Werror//g' {} +

        # Fix for note.S: changed section flags for .note.Linux (harmless for GNU AS)
        sed -i 's/ELFNOTE_START(Linux, 0, "a")/ELFNOTE_START(Linux, 0, "")/g' \
          arch/arm64/kernel/vdso/note.S

        # Fix for vdso linking: unrecognised emulation mode: aarch64linux
        sed -i 's/ccflags-y := -shared -fno-common -fno-builtin/ccflags-y := -shared -fno-common -fno-builtin -fuse-ld=lld/g' \
          arch/arm64/kernel/vdso/Makefile

    - name: Fix scripts permissions
      run: |
        find kernel-4.19 -name "*.sh" -exec chmod +x {} \;
        chmod +x kernel-4.19/tools/build/cpio || true

    - name: Fix Windows Git Case Issues (Netfilter Headers & Sources)
      run: |
        cd kernel-4.19/include/uapi/linux/netfilter/
        for mod in connmark rateest tcpmss DSCP MARK; do
          [ -f "xt_${mod}_1.h" ] && cp "xt_${mod}_1.h" "xt_${mod}.h" || true
        done
        cd ../netfilter_ipv6/ || true
        [ -f "ip6t_HL_1.h" ] && cp "ip6t_HL_1.h" "ip6t_HL.h" || true
        [ -f "ip6t_hl_1.h" ] && cp "ip6t_hl_1.h" "ip6t_hl.h" || true
        cd ../netfilter_ipv4/ || true
        [ -f "ipt_TTL_1.h" ] && cp "ipt_TTL_1.h" "ipt_TTL.h" || true
        [ -f "ipt_ttl_1.h" ] && cp "ipt_ttl_1.h" "ipt_ttl.h" || true
        cd ../../../../net/netfilter/
        for mod in dscp DSCP mark MARK connmark CONNMARK rateest RATEEST tcpmss TCPMSS hl HL; do
          [ -f "xt_${mod}_1.c" ] && cp "xt_${mod}_1.c" "xt_${mod}.c" || true
        done
        cd ../../..

    - name: Ensure missing dt-bindings exist
      run: |
        mkdir -p kernel-4.19/include/dt-bindings/thermal/
        if [ ! -f kernel-4.19/include/dt-bindings/thermal/thermal.h ]; then
          echo '#ifndef _DT_BINDINGS_THERMAL_THERMAL_H' > kernel-4.19/include/dt-bindings/thermal/thermal.h
          echo '#define _DT_BINDINGS_THERMAL_THERMAL_H' >> kernel-4.19/include/dt-bindings/thermal/thermal.h
          echo '#define THERMAL_NO_LIMIT (~0)' >> kernel-4.19/include/dt-bindings/thermal/thermal.h
          echo '#endif' >> kernel-4.19/include/dt-bindings/thermal/thermal.h
        fi

    - name: Build the Kernel
      run: |
        cd kernel-4.19
        rm -rf out/

        make \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LD=ld.lld \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          O=out \
          amar_row_wifi_defconfig 2>&1 | tee ../kernel_build.log

        make \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LD=ld.lld \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          O=out \
          -j$(nproc) 2>&1 | tee -a ../kernel_build.log

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cp kernel-4.19/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
        cp kernel-4.19/out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
        cp kernel-4.19/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh

        zip -r9 ../NetHunter-x306f-$(date +%Y%m%d).zip * \
          -x .git README.md *placeholder
        cd ..

    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-x306f
        path: NetHunter-x306f-*.zip
        retention-days: 7
