name: Build NetHunter Kernel

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for Kali NetHunter
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git \
        gnupg libncurses5 libncurses5-dev libssl-dev libelf-dev \
        libxml2 libxml2-utils lzop rsync zip zlib1g-dev \
        python3 libarchive-tools wget patch \
        clang lld llvm

    - name: Download Android GCC Toolchain
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

    - name: Check Clang from repo
      run: |
        ls prebuilts/clang/host/linux-x86/clang-r383902/bin/
        chmod +x prebuilts/clang/host/linux-x86/clang-r383902/bin/*
        prebuilts/clang/host/linux-x86/clang-r383902/bin/clang --version || echo "CLANG BROKEN"

    - name: Apply NetHunter Patches
      run: |
        git clone https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git /tmp/nh-builder || true
        cd kernel-4.19

        if [ -f "/tmp/nh-builder/patches/mac80211/mac80211-1.0-4.14.patch" ]; then
          patch -p1 --forward < /tmp/nh-builder/patches/mac80211/mac80211-1.0-4.14.patch || echo "Patch mac80211 already applied or conflict"
        fi

        if [ -f "/tmp/nh-builder/patches/hid/hid-4.14.patch" ]; then
          patch -p1 --forward < /tmp/nh-builder/patches/hid/hid-4.14.patch || echo "Patch hid already applied or conflict"
        fi
        cd ..

    - name: Fix scripts permissions
      run: find kernel-4.19 -name "*.sh" -exec chmod +x {} \;

    - name: Build the Kernel
      run: |
        chmod +x build_kernel.sh
        ./build_kernel.sh

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cp kernel-4.19/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
        cp kernel-4.19/out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
        cp kernel-4.19/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh

        zip -r9 ../NetHunter-x306f-$(date +%Y%m%d).zip * \
          -x .git README.md *placeholder
        cd ..

    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-x306f
        path: NetHunter-x306f-*.zip
        retention-days: 7
